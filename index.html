<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>언론기사 자동화 제너레이터</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="modal-wrapper">
        <div class="modal-card">

            <header class="modal-header">
                <h1 class="modal-title">언론기사 자동화 모듈</h1>
                <p class="modal-subtitle" id="modalSubtitle">필요한 정보를 입력해 주시면 언론기사 초안을 생성해 드립니다.</p>

            </header>

            <form id="articleForm">

                <!-- 1단계: 정보 입력 (공통 + 조건부 특화 통합) -->
                <section class="form-step active" id="step1">


                    <!-- 기사 유형 선택 (Tab / Segmented Control) -->
                    <div class="form-group">
                        <label>기사 유형 선택 <span class="text-red-500 ml-1">*</span></label>
                        <div class="tab-group" id="chipGroup">
                            <button type="button" class="tab" data-type="typeA">행사 참여</button>
                            <button type="button" class="tab" data-type="typeB">인증 획득</button>
                            <button type="button" class="tab" data-type="typeC">서비스 런칭</button>
                            <button type="button" class="tab" data-type="typeD">그 외 성과</button>
                        </div>
                        <!-- hidden input to carry the value for FormData -->
                        <input type="hidden" id="articleType" name="articleType" value="">
                    </div>

                    <!-- 공통 필드: 소속 기업 및 팀 -->
                    <div class="form-group">
                        <div class="field-row field-row--2col">
                            <div class="field-row-item">
                                <label for="company" class="sub-label">소속 기업 <span class="text-red-500 ml-1">*</span></label>
                                <input type="text" id="company" name="company" value="알파브라더스">
                            </div>
                            <div class="field-row-item">
                                <label for="division" class="sub-label">본부/팀</label>
                                <input type="text" id="division" name="division" placeholder="예: AI팀, 전략기획팀 등">
                            </div>
                        </div>
                    </div>

                    <!-- 조건부 렌더링 영역: 유형별 특화 폼 -->
                    <div id="specificFieldsWrapper">

                        <!-- 유형 A: 행사 참여 -->
                        <div id="typeA_fields" class="type-fields">
                            <div class="type-fields-inner">

                                <!-- 핵심 키워드 -->
                                <div class="form-group">
                                    <label for="keywords_A">핵심 키워드 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="keywords_A" name="keywords" placeholder="예: 알파브라더스, AX컨설팅, 자동화 (콤마로 구분)">
                                </div>

                                <!-- ① 행사명 -->
                                <div class="form-group">
                                    <label for="event_name">행사명 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="event_name" name="event_name" placeholder="예: 2025 지역 IP 투자·기술 네트워킹데이">
                                </div>

                                <!-- ② 일시 + 장소 (2열 그리드) -->
                                <div class="form-group">
                                    <div class="field-row field-row--2col">
                                        <div class="field-row-item">
                                            <label for="event_date" class="sub-label">행사 일시 <span class="text-red-500 ml-1">*</span></label>
                                            <input type="date" id="event_date" name="event_date">
                                        </div>
                                        <div class="field-row-item">
                                            <label for="event_place" class="sub-label">행사 장소 <span class="text-red-500 ml-1">*</span></label>
                                            <input type="text" id="event_place" name="event_place" placeholder="예: 코엑스 바다와홀">
                                        </div>
                                    </div>
                                </div>

                                <!-- ③ 주최/주관 기관 -->
                                <div class="form-group">
                                    <label for="event_org">주최/주관 기관 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="event_org" name="event_org" placeholder="예: 한국무역협회">
                                </div>

                                <!-- ④ 규모 및 성과 수치 (선택) -->
                                <div class="form-group">
                                    <label for="event_metrics">행사 규모 및 구체적 성과 수치</label>
                                    <input type="text" id="event_metrics" name="event_metrics"
                                        placeholder="예: 참관객 500명, 계약 건수 10건 등">
                                </div>

                                <!-- ── 나머지 항목 ── -->

                                <!-- 자사 핵심 역할 및 주요 활동 내역 -->
                                <div class="form-group">
                                    <label for="event_role">자사 핵심 역할 및 주요 활동 내역 <span class="text-red-500 ml-1">*</span></label>
                                    <textarea id="event_role" name="event_role"
                                        placeholder="자사의 역할과 주요 활동을 육하원칙에 맞춰 상세히 작성해 주세요."></textarea>
                                </div>

                                <!-- 관계자 코멘트 -->
                                <div class="form-group">
                                    <label for="event_quote">관계자 코멘트</label>
                                    <textarea id="event_quote" name="event_quote"
                                        placeholder="기사에 인용될 핵심 인터뷰 멘트를 자연스럽게 작성해 주세요."></textarea>
                                </div>

                                <!-- 관계자명 및 직함 -->
                                <div class="form-group">
                                    <label for="speaker_A">관계자명 및 직함</label>
                                    <input type="text" id="speaker_A" name="speaker" placeholder="예: AI팀 조연경 팀장">
                                </div>

                            </div>
                        </div>

                        <!-- 유형 B: 인증 획득/선정 -->
                        <div id="typeB_fields" class="type-fields">
                            <div class="type-fields-inner">
                                <div class="form-group">
                                    <label for="keywords_B">핵심 키워드 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="keywords_B" name="keywords" placeholder="콤마(,)로 구분">
                                </div>
                                <div class="form-group">
                                    <label for="cert_name">인증(사업)명 및 선정 의미 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="cert_name" name="cert_name" placeholder="예: 2026 데이터바우처 지원사업 공급기업 선정">
                                </div>
                                <div class="form-group">
                                    <label for="cert_org">주최 및 주관 기관 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="cert_org" name="cert_org" placeholder="예: 과학기술정보통신부">
                                </div>
                                <div class="form-group">
                                    <label for="cert_core">선정 배경 및 자사 핵심 역량 <span class="text-red-500 ml-1">*</span></label>
                                    <textarea id="cert_core" name="cert_core"
                                        placeholder="해당 인증을 획득할 수 있었던 자사의 핵심 역량을 상세히 작성해 주세요."></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="cert_plan">선정 혜택 및 향후 비즈니스 계획 <span class="text-red-500 ml-1">*</span></label>
                                    <textarea id="cert_plan" name="cert_plan" placeholder="선정으로 얻은 혜택과 향후 비즈니스 계획을 상세히 작성해 주세요."></textarea>
                                </div>
                                <!-- 관계자 코멘트 -->
                                <div class="form-group">
                                    <label for="cert_quote">관계자 코멘트</label>
                                    <textarea id="cert_quote" name="cert_quote" placeholder="기사에 인용될 핵심 인터뷰 멘트를 자연스럽게 작성해 주세요."></textarea>
                                </div>

                                <!-- 관계자명 및 직함 -->
                                <div class="form-group">
                                    <label for="speaker_B">관계자명 및 직함</label>
                                    <input type="text" id="speaker_B" name="speaker" placeholder="예: AI팀 조연경 팀장">
                                </div>
                            </div>
                        </div>

                        <!-- 유형 C: 서비스 런칭 -->
                        <div id="typeC_fields" class="type-fields">
                            <div class="type-fields-inner">
                                <div class="form-group">
                                    <label for="keywords_C">핵심 키워드 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="keywords_C" name="keywords" placeholder="콤마(,)로 구분">
                                </div>
                                <div class="form-group">
                                    <label for="launch_name">서비스/제품명 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="launch_name" name="launch_name" placeholder="예: 디자인 월정액 구독 서비스">
                                </div>
                                <div class="form-group">
                                    <label for="launch_target">메인 타겟 고객 및 기존 시장의 문제점 <span class="text-red-500 ml-1">*</span></label>
                                    <textarea id="launch_target" name="launch_target"
                                        placeholder="주요 타겟 고객과 기존 시장의 문제점을 상세히 작성해 주세요."></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="launch_solution">서비스 핵심 솔루션 <span class="text-red-500 ml-1">*</span></label>
                                    <textarea id="launch_solution" name="launch_solution"
                                        placeholder="서비스의 핵심 솔루션과 차별화 포인트를 상세히 작성해 주세요."></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="launch_promo">런칭 프로모션</label>
                                    <textarea id="launch_promo" name="launch_promo"
                                        placeholder="예: 월 299만원, 첫 달 100만원 할인 프로모션 진행 등"></textarea>
                                </div>
                                <!-- 관계자 코멘트 -->
                                <div class="form-group">
                                    <label for="launch_quote">관계자 코멘트</label>
                                    <textarea id="launch_quote" name="launch_quote"
                                        placeholder="기사에 인용될 핵심 인터뷰 멘트를 자연스럽게 작성해 주세요."></textarea>
                                </div>

                                <!-- 관계자명 및 직함 -->
                                <div class="form-group">
                                    <label for="speaker_C">관계자명 및 직함</label>
                                    <input type="text" id="speaker_C" name="speaker" placeholder="예: AI팀 조연경 팀장">
                                </div>
                            </div>
                        </div>

                        <!-- 유형 D: 그 외 성과 -->
                        <div id="typeD_fields" class="type-fields">
                            <div class="type-fields-inner">
                                <div class="form-group">
                                    <label for="keywords_D">핵심 키워드 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="keywords_D" name="keywords" placeholder="콤마(,)로 구분">
                                </div>
                                <div class="form-group">
                                    <label for="achieve_name">성과의 핵심 주제 및 프로젝트명 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="achieve_name" name="achieve_name" placeholder="예: 혁신소상공인 투자연계지원사업 립스 II 운영">
                                </div>
                                <div class="form-group">
                                    <label for="achieve_metrics">정량/정성적 핵심 성과 수치 및 달성 기간 <span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" id="achieve_metrics" name="achieve_metrics"
                                        placeholder="예: 1년간 운영, 17개사 협약 체결 등">
                                </div>
                                <div class="form-group">
                                    <label for="achieve_reason">성공 요인 <span class="text-red-500 ml-1">*</span></label>
                                    <textarea id="achieve_reason" name="achieve_reason"
                                        placeholder="성과를 달성할 수 있었던 차별화 전략을 상세히 작성해 주세요."></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="achieve_case">우수 사례</label>
                                    <textarea id="achieve_case" name="achieve_case"
                                        placeholder="구체적인 우수 사례나 대표 성과를 요약해 주세요."></textarea>
                                </div>
                                <!-- 관계자 코멘트 -->
                                <div class="form-group">
                                    <label for="achieve_quote">관계자 코멘트</label>
                                    <textarea id="achieve_quote" name="achieve_quote"
                                        placeholder="기사에 인용될 핵심 인터뷰 멘트를 자연스럽게 작성해 주세요."></textarea>
                                </div>

                                <!-- 관계자명 및 직함 -->
                                <div class="form-group">
                                    <label for="speaker_D">관계자명 및 직함</label>
                                    <input type="text" id="speaker_D" name="speaker" placeholder="예: AI팀 조연경 팀장">
                                </div>
                            </div>
                        </div>

                    </div><!-- /#specificFieldsWrapper -->

                </section>

                <section class="form-step" id="step2">

                    <div class="loading-state hidden" id="loadingState">
                        <div class="spinner"></div>
                        <h3 style="margin-top: 20px;">AI가 완성도 높은 언론기사를 작성하고 있습니다...</h3>
                        <p style="color: #6B7280; font-size: 0.9rem; margin-top: 8px;">(약 30초에서 1분 정도 소요될 수 있습니다. 창을 닫지 말고 잠시만 기다려주세요.)</p>
                    </div>

                    <div class="result-state hidden" id="resultState">
                        <h3 style="margin-bottom: 8px;">언론기사 결과물</h3>
                        <p style="color: #6B7280; font-size: 0.9rem; margin-bottom: 16px;">수정이 필요한 부분이 있다면 텍스트창에서 바로 수정할 수 있습니다.</p>
                        
                        <!-- 메인 제목 창 -->
                        <div class="form-group" style="margin-bottom: 24px;">
                            <label for="mainTitleOutput" style="font-weight: bold; color: var(--color-primary); display: block; margin-bottom: 4px;">제목</label>
                            
                            <p class="text-sm text-gray-500" style="font-size: 0.85rem; color: #6b7280; margin-bottom: 12px; margin-top: 0;">
                                AI가 추가로 제안하는 제목 중 마음에 드는 것을 선택하면 아래 입력창에 바로 반영됩니다.
                            </p>

                            <!-- AI 추천 제목 칩 -->
                            <div id="variationChips" class="variation-chips" style="margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px;">
                                <!-- JS로 동적 렌더링 -->
                            </div>

                            <textarea id="mainTitleOutput"
                                style="min-height: 40px; height: auto; background-color: #fafafa; font-size: 1rem; line-height: 1.4; font-weight: bold; resize: none; overflow: hidden; width: 100%; border-radius: 8px; border: 1px solid #ccc; padding: 12px;"
                                placeholder="제목이 표시됩니다."></textarea>
                        </div>

                        <!-- 본문 창 -->
                        <div class="form-group">
                            <label for="bodyTextOutput" style="font-weight: bold; color: var(--color-primary); display: block; margin-bottom: 8px;">본문</label>
                            <textarea id="bodyTextOutput"
                                style="min-height: 250px; background-color: #fafafa; font-size: 0.95rem; line-height: 1.6; width: 100%; border-radius: 8px; border: 1px solid #ccc; padding: 16px;"
                                placeholder="본문이 표시됩니다."></textarea>
                        </div>
                    </div>
                </section>

            </form>

            <footer class="modal-footer">
                <button type="button" id="backBtn" class="btn btn-secondary hidden">뒤로가기</button>
                <button type="button" id="resetBtn" class="btn btn-secondary hidden">다시 만들기</button>
                <div class="spacer"></div>
                <button type="button" id="nextBtn" class="btn btn-primary" disabled>생성하기</button>
                <button type="button" id="copyBtn" class="btn btn-primary hidden">복사하기</button>
            </footer>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
